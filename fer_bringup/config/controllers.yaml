controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    vel_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    effort_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: fer
    
vel_joint_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      fer_joint1: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint2: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint3: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint4: { p: 2.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint5: { p: 3.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint6: { p: 3.0, d: 0.0, i: 0.0, i_clamp: 1.0 }
      fer_joint7: { p: 3.0, d: 0.0, i: 0.0, i_clamp: 1.0 }

effort_joint_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fer_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
      fer_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
      fer_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
      fer_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
      fer_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
      fer_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
      fer_joint7: { p: 50., d: 5., i: 0., i_clamp: 1. }

