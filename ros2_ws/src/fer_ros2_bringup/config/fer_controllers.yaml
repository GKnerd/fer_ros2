# Controllers shared by every backend. The launch files load this file first,
# followed by one backend file (fer_controllers_real.yaml or
# fer_controllers_gripper.yaml).

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    effort_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    velocity_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    position_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

effort_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    gains:
      fer_joint1: { p: 600., d: 30., i: 0., antiwindup_strategy: "none" }
      fer_joint2: { p: 600., d: 30., i: 0., antiwindup_strategy: "none" }
      fer_joint3: { p: 600., d: 30., i: 0., antiwindup_strategy: "none" }
      fer_joint4: { p: 600., d: 30., i: 0., antiwindup_strategy: "none" }
      fer_joint5: { p: 250., d: 10., i: 0., antiwindup_strategy: "none" }
      fer_joint6: { p: 150., d: 10., i: 0., antiwindup_strategy: "none" }
      fer_joint7: { p: 50., d: 5., i: 0., antiwindup_strategy: "none" }
    # Cancel: decelerate at half the FER datasheet joint acceleration limits, then hold.
    constraints:
      decelerate_on_cancel: true
      fer_joint1: { max_deceleration_on_cancel: 7.5 }
      fer_joint2: { max_deceleration_on_cancel: 3.75 }
      fer_joint3: { max_deceleration_on_cancel: 5.0 }
      fer_joint4: { max_deceleration_on_cancel: 6.25 }
      fer_joint5: { max_deceleration_on_cancel: 7.5 }
      fer_joint6: { max_deceleration_on_cancel: 10.0 }
      fer_joint7: { max_deceleration_on_cancel: 10.0 }

velocity_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      fer_joint1: { p: 2.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint2: { p: 2.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint3: { p: 2.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint4: { p: 2.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint5: { p: 3.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint6: { p: 3.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
      fer_joint7: { p: 3.0, d: 0.0, i: 0.0, antiwindup_strategy: "none" }
    # Cancel: decelerate at half the FER datasheet joint acceleration limits, then hold.
    constraints:
      decelerate_on_cancel: true
      fer_joint1: { max_deceleration_on_cancel: 7.5 }
      fer_joint2: { max_deceleration_on_cancel: 3.75 }
      fer_joint3: { max_deceleration_on_cancel: 5.0 }
      fer_joint4: { max_deceleration_on_cancel: 6.25 }
      fer_joint5: { max_deceleration_on_cancel: 7.5 }
      fer_joint6: { max_deceleration_on_cancel: 10.0 }
      fer_joint7: { max_deceleration_on_cancel: 10.0 }

position_trajectory_controller:
  ros__parameters:
    joints:
      - fer_joint1
      - fer_joint2
      - fer_joint3
      - fer_joint4
      - fer_joint5
      - fer_joint6
      - fer_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # Cancel: decelerate at half the FER datasheet joint acceleration limits, then hold.
    constraints:
      decelerate_on_cancel: true
      fer_joint1: { max_deceleration_on_cancel: 7.5 }
      fer_joint2: { max_deceleration_on_cancel: 3.75 }
      fer_joint3: { max_deceleration_on_cancel: 5.0 }
      fer_joint4: { max_deceleration_on_cancel: 6.25 }
      fer_joint5: { max_deceleration_on_cancel: 7.5 }
      fer_joint6: { max_deceleration_on_cancel: 10.0 }
      fer_joint7: { max_deceleration_on_cancel: 10.0 }
