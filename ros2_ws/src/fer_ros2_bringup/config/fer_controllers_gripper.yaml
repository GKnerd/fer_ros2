# Gripper as ros2_control controllers (hardware:=mujoco) — loaded after
# fer_controllers.yaml. On the real robot the gripper is the franka_gripper node.
controller_manager:
  ros__parameters:
    gripper_position_controller:
      type: position_controllers/GripperActionController

    gripper_effort_controller:
      type: effort_controllers/GripperActionController

gripper_position_controller:
  ros__parameters:
    joint: fer_finger_joint1
    action_monitor_rate: 20.0
    goal_tolerance: 0.005

gripper_effort_controller:
  ros__parameters:
    joint: fer_finger_joint1
    action_monitor_rate: 20.0
