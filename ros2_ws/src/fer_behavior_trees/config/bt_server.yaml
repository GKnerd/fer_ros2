# Parameters for the BTActionServer (BT::TreeExecutionServer).
# The default node name from the NodeOptions constructor is "bt_action_server".
bt_action_server:
  ros__parameters:
    action_name: "execute_tree"      # ros2 action send_goal /execute_tree ...
    tick_frequency: 100              # Hz
    groot2_port: 1667               # Groot2 live-monitoring port
    ros_plugins_timeout: 3000       # ms — action-client discovery timeout per skill

    # Folders (package_name/subfolder) scanned for BT XML files. Every tree
    # found here is registered and selectable via the ExecuteTree goal's
    # `target_tree` field (e.g. "ChainedPickPlace").
    behavior_trees:
      - fer_behavior_trees/trees
