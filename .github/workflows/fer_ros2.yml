name: Platform

on:
  pull_request:
  push:
    branches: [jazzy_devel, main]
  workflow_dispatch:
  schedule:
    # Weekly build without cache: picks up new Jazzy apt syncs and refreshes the cache.
    - cron: '0 3 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    # Builds docker/Dockerfile as on the x86_64 workstation and the Orin, then runs
    # colcon test for every package in the image.
    name: build-and-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            with_mujoco: 1
          - arch: aarch64
            runner: ubuntu-24.04-arm
            with_mujoco: 0
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: WITH_MUJOCO=${{ matrix.with_mujoco }}
          load: true
          tags: fer_ros2/ros:ci
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Test
        run: |
          docker run --name ci fer_ros2/ros:ci bash -c \
            "unset CYCLONEDDS_URI; cd ~/ros2_ws && colcon test --merge-install --executor sequential --event-handlers console_cohesion+ && colcon test-result --verbose"

      - name: Collect test results
        if: failure()
        run: |
          mkdir -p ci_output
          docker cp ci:/home/fer_ros2/ros2_ws/build ci_output/build
          docker cp ci:/home/fer_ros2/ros2_ws/log ci_output/log

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.arch }}
          path: |
            ci_output/build/*/test_results/
            ci_output/build/*/pytest.xml
            ci_output/log/
          retention-days: 7
