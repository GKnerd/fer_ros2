name: Description

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  description-invariant:
    # fer.urdf.xacro must reproduce upstream franka_description for every
    # hardware backend and add exactly one consistent ros2_control overlay.
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - name: Clone franka_description at the Dockerfile pin
        run: |
          pin=$(sed -n 's/^ARG FRANKA_DESCRIPTION_COMMIT=//p' docker/Dockerfile)
          test -n "$pin"
          git clone https://github.com/frankarobotics/franka_description.git ros2_ws/src/franka_description
          git -C ros2_ws/src/franka_description checkout "$pin"

      - name: Install dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths ros2_ws/src/franka_description ros2_ws/src/fer_ros2_bringup --ignore-src -r -y \
            --dependency-types build --dependency-types buildtool --dependency-types test

      - name: Build
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select franka_description fer_ros2_bringup

      - name: Test
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select fer_ros2_bringup --ctest-args -R test_description
          colcon test-result --verbose
